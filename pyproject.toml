[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kingai-gpu"
version = "0.2.1rc1"
description = "Open-source GPU monitoring, overclocking, and stability testing for NVIDIA GPUs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "nvidia-ml-py>=12.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
gui = ["dearpygui>=2.0"]
dev = ["pytest", "ruff"]

[project.scripts]
kingai-gpu = "kingai_gpu.cli.main:main"

[tool.setuptools.packages.find]
include = ["kingai_gpu*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["ignore", "tests/probe_*.py"]

[tool.ruff.lint]
# Preserve the project's historical core error gate across Ruff default changes.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --basetemp=.pytest-tmp"
