name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test tools
        run: python -m pip install --upgrade pip build && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check kingai_gpu tests

      - name: Test without GPU access
        run: python -m pytest

      - name: Build distributions
        run: python -m build

  windows-offline:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check kingai_gpu tests

      - name: Test fake backends without GPU access
        run: python -m pytest

      - name: Build distributions
        run: python -m build
